# Copy these into Streamlit Community Cloud: App settings → Secrets.
# Locally you can put them in .streamlit/secrets.toml (git-ignored) or use environment variables.

SHARED_DEPLOYMENT = "true"        # per-visitor preferences, no manual price refresh button

# Open to everyone on your key, within a shared daily budget.
ANTHROPIC_API_KEY = "sk-ant-..."
DAILY_BUDGET_EUR = "3.00"         # all visitors together; resets at midnight Amsterdam time
SESSION_BUDGET_EUR = "1.00"       # per browser session, so one visitor can't use up the day
# USD_TO_EUR = "0.92"             # Anthropic bills in USD; update if the rate moves a lot
ADMIN_CODE = "choose-something"   # only you can import or delete promotions

# Optional: require a code before anyone can use your key (leave out for an open app).
# ACCESS_CODE = "choose-something"

# Keep promotions and the daily spend across restarts (e.g. Supabase Postgres connection string).
# PROMOS_DATABASE_URL = "postgresql://postgres.xxxx:password@aws-0-eu-central-1.pooler.supabase.com:5432/postgres"
