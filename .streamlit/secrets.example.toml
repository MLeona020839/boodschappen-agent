# Copy these into Streamlit Community Cloud: App settings → Secrets.
# Locally you can put them in .streamlit/secrets.toml (git-ignored) or use environment variables.

SHARED_DEPLOYMENT = "true"        # per-visitor preferences, no manual price refresh button

# Optional: your own key, shared with people who know the access code.
# Leave both out if every visitor should bring their own key.
# ANTHROPIC_API_KEY = "sk-ant-..."
# ACCESS_CODE = "choose-something"
# SESSION_BUDGET_USD = "1.00"     # max spend per browser session on the shared key

# Optional: keep imported promotions across restarts (e.g. Supabase Postgres connection string).
# PROMOS_DATABASE_URL = "postgresql://postgres.xxxx:password@aws-0-eu-central-1.pooler.supabase.com:5432/postgres"
